const grid = document.getElementById('grid');

function render(filter) {
  grid.innerHTML = '';
  logos.forEach((logo, i) => {
    if (filter && !logo.tags.includes(filter)) return;
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-tags', logo.tags.join(','));
    card.innerHTML = `<div class="num">#${i+1}</div>${logo.svg}<div class="name">${logo.name}</div><div class="tags">${logo.tags.map(t=>'#'+t).join(' ')}</div>`;
    grid.appendChild(card);
  });
}

function filterTag(tag) {
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render(tag);
}

function filterAll() {
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  render(null);
}

render(null);
</script>
